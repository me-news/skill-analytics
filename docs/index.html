<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ME News Skill Analytics</title><style>
:root{color-scheme:dark;--bg:#08111f;--card:#101c2e;--line:#24344d;--text:#ecf3ff;--muted:#91a4c2;--accent:#57d3a0;--warn:#f5b95f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07101c,#0c1830);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:40px 20px}h1{margin:0;font-size:32px}h2{margin-top:30px}.subtitle{color:var(--muted);margin:6px 0 28px}.summary,.grid{display:grid;gap:14px}.summary{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:20px}.grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.card{background:rgba(16,28,46,.92);border:1px solid var(--line);border-radius:14px;padding:18px}.metric{font-size:28px;font-weight:750}.label,.meta{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.ok{color:var(--accent)}.warn{color:var(--warn)}a{color:#89bfff}footer{margin-top:28px;color:var(--muted);font-size:13px}</style></head>
<body><main><h1>ME News Skill Analytics</h1><p class="subtitle">Skill 多平台发行数据 MVP · 每日快照</p><div id="app">加载中…</div><footer>不同平台统计口径不同，不能将安装量直接视为独立用户数。</footer>
<script>
const n=v=>v==null?'—':new Intl.NumberFormat('en-US').format(v);
const compact=v=>{const m=String(v||'').trim().match(/^([\d.]+)([kKmM]?)$/);if(!m)return null;return Number(m[1])*({k:1e3,m:1e6}[m[2].toLowerCase()]||1)};
fetch('./data/index.json?v=2026-08-13T06%3A07%3A33.739Z').then(r=>r.json()).then(({snapshots})=>{const s=snapshots.at(-1);if(!s){app.textContent='暂无采集数据';return}const downloads=s.clawhubSkills.reduce((a,x)=>a+(x.data.metrics.downloads||0),0);const installs=s.skillsShListings.reduce((a,x)=>a+(x.data.metrics.installs||0),0);const askillDownloads=s.askillSkills.reduce((a,x)=>a+(compact(x.data.metrics.downloadsLabel)||0),0);const agentSkillInstalls=s.agentSkillListings.reduce((a,x)=>a+(x.data.metrics.installs||0),0);const skillHubDownloads=(s.skillHubListings||[]).reduce((a,x)=>a+(x.data.metrics.downloads||0),0);const skillHubInstalls=(s.skillHubListings||[]).reduce((a,x)=>a+(x.data.metrics.installs||0),0);const gh=s.sharedPlatforms.github.metrics;app.innerHTML=
`<section class="summary"><div class="card"><div class="label">ClawHub Skills</div><div class="metric">${s.clawhubSkills.length}</div></div><div class="card"><div class="label">ClawHub 下载合计</div><div class="metric">${n(downloads)}</div></div><div class="card"><div class="label">skills.sh 安装合计</div><div class="metric">${n(installs)}</div><div class="label">${s.skillsShListings.length} 个页面</div></div><div class="card"><div class="label">askill.sh 下载合计（约）</div><div class="metric">${n(askillDownloads)}</div><div class="label">${s.askillSkills.length} 个页面，仅提供缩写数值</div></div><div class="card"><div class="label">agentskill.sh 安装合计</div><div class="metric">${n(agentSkillInstalls)}</div><div class="label">${s.agentSkillListings.length} 个页面</div></div><div class="card"><div class="label">腾讯 SkillHub 下载合计</div><div class="metric">${n(skillHubDownloads)}</div><div class="label">${s.skillHubListings?.length||0} 个页面 · ClawHub 同步数据</div></div><div class="card"><div class="label">腾讯 SkillHub 安装合计</div><div class="metric">${n(skillHubInstalls)}</div></div><div class="card"><div class="label">GitHub Stars</div><div class="metric">${n(gh.stars)}</div><a href="${s.sharedPlatforms.github.url}">查看源仓库</a></div></section><h2>ClawHub</h2><section class="grid">`+
s.clawhubSkills.map(x=>{const d=x.data;return `<article class="card"><h3>${x.slug}</h3><div class="row"><span>下载</span><strong>${n(d.metrics.downloads)}</strong></div><div class="row"><span>安装</span><strong>${n(d.metrics.installs)}</strong></div><div class="row"><span>版本</span><strong>${d.version||'—'}</strong></div><div class="row"><span>状态</span><strong class="${d.status==='ok'?'ok':'warn'}">${d.status}</strong></div><a href="${d.url}">查看源页面</a></article>`}).join('')+
`</section><h2>skills.sh</h2><section class="grid">`+s.skillsShListings.map(x=>{const d=x.data;return `<article class="card"><h3>${x.name}</h3><div class="row"><span>安装</span><strong>${n(d.metrics.installs)}</strong></div><div class="row"><span>最近周期</span><strong>${d.metrics.weeklyInstalls?.join(' / ')||'—'}</strong></div><div class="row"><span>状态</span><strong class="${d.status==='ok'?'ok':'warn'}">${d.status}</strong></div><a href="${d.url}">查看源页面</a></article>`}).join('')+
`</section><h2>askill.sh</h2><section class="grid">`+s.askillSkills.map(x=>{const d=x.data;return `<article class="card"><h3>${x.slug}</h3><div class="row"><span>下载</span><strong>${d.metrics.downloadsLabel||'—'}</strong></div><div class="row"><span>Stars</span><strong>${n(d.metrics.stars)}</strong></div><div class="row"><span>状态</span><strong class="${d.status==='ok'?'ok':'warn'}">${d.status}</strong></div><a href="${d.url}">查看源页面</a></article>`}).join('')+
`</section><h2>agentskill.sh</h2><section class="grid">`+s.agentSkillListings.map(x=>{const d=x.data;return `<article class="card"><h3>${x.slug}</h3><div class="row"><span>安装</span><strong>${n(d.metrics.installs)}</strong></div><div class="row"><span>7 天安装</span><strong>${n(d.metrics.installs7d)}</strong></div><div class="row"><span>安全评分</span><strong>${n(d.metrics.securityScore)}</strong></div><div class="row"><span>已认证</span><strong class="${d.verified?'ok':'warn'}">${d.verified?'是':'否'}</strong></div><div class="row"><span>状态</span><strong class="${d.status==='ok'?'ok':'warn'}">${d.status}</strong></div><a href="${d.url}">查看源页面</a> · <a href="${d.apiUrl}">查看源数据</a></article>`}).join('')+
`</section><h2>腾讯 SkillHub</h2><section class="grid">`+(s.skillHubListings||[]).map(x=>{const d=x.data;return `<article class="card"><h3>${x.slug}</h3><div class="row"><span>下载</span><strong>${n(d.metrics.downloads)}</strong></div><div class="row"><span>安装</span><strong>${n(d.metrics.installs)}</strong></div><div class="row"><span>版本</span><strong>${d.version||'—'}</strong></div><div class="row"><span>双重安全扫描</span><strong class="${d.security?.keen==='benign'&&d.security?.sanbu==='benign'?'ok':'warn'}">${d.security?.keen==='benign'&&d.security?.sanbu==='benign'?'通过':'待检查'}</strong></div><div class="row"><span>认领状态</span><strong class="${d.claimState==='claimed'?'ok':'warn'}">${d.claimState||'—'}</strong></div><div class="row"><span>状态</span><strong class="${d.status==='ok'?'ok':'warn'}">${d.status}</strong></div><a href="${d.url}">查看源页面</a> · <a href="${d.apiUrl}">查看源数据</a></article>`}).join('')+`</section><p class="meta">最后采集：${new Date(s.collectedAt).toLocaleString('zh-CN',{timeZone:s.timezone})}（${s.timezone}） · 历史快照 ${snapshots.length} 天</p>`;
}).catch(e=>app.textContent='载入失败：'+e.message);
</script></main></body></html>
